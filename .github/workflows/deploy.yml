name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  preparar:
    needs: verificar
    outputs:
      pacote: ${{ steps.pacote.outputs.nome }}

    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar versão de produção
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ENABLE_DEMO: 'false'
        run: |
          test -n "$VITE_API_URL" || (echo 'Configure a variável Actions VITE_API_URL' && exit 1)
          npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Identificar pacote desta tentativa
        id: pacote
        run: echo "nome=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: ${{ steps.pacote.outputs.nome }}

  deploy:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aguardar o pacote no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PACOTE: ${{ needs.preparar.outputs.pacote }}
        run: |
          for tentativa in {1..18}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PACOTE" --jq '.artifacts[].name' | grep -Fxq "$PACOTE"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pacote $PACOTE indisponível no GitHub após 90 segundos."
          exit 1

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.preparar.outputs.pacote }}
